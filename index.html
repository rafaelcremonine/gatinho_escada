<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gatinho na Escada</title>
<meta name="theme-color" content="#1a2030">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gatinho na Escada">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="controls">
    <button class="ctl-btn active" id="play-btn" title="Pausar / continuar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <button class="ctl-btn" id="speed-btn" title="Velocidade"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>
    <button class="ctl-btn" id="cam-btn" title="Mudar câmera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button>
  </div>

  <div class="info">
    <div><b>🐱 Gatinho na escada espiral</b></div>
    <div style="margin-top:8px">Subindo pra sempre! Arraste pra olhar em volta.</div>
    <div style="margin-top:4px" id="spd">Velocidade: normal</div>
  </div>

  <script src="./vendor.js"></script>
  <script src="./app.js"></script>
</body>
</html>
